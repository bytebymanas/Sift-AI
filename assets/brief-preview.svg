    <rect x="76" y="236" width="368" height="5" rx="2"/><rect x="76" y="249" width="360" height="5" rx="2"/><rect x="76" y="262" width="344" height="5" rx="2"/><rect x="76" y="275" width="368" height="5" rx="2"/><rect x="76" y="288" width="210" height="5" rx="2"/>
  </g>
