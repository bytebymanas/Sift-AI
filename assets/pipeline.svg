<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" role="img" aria-label="Sift AI daily pipeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/><stop offset="1" stop-color="#1b1747"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#302b63"/><stop offset="1" stop-color="#1f1b4a"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#20BEFF"/>
    </marker>
  </defs>
  <rect width="1000" height="270" rx="20" fill="url(#bg)"/>
  <text x="500" y="38" text-anchor="middle" fill="#9aa4c7" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="3">ONE RUN, END TO END</text>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <!-- nodes -->
    <g>
      <rect x="40" y="70" width="128" height="96" rx="14" fill="url(#node)" stroke="#20BEFF" stroke-opacity=".6"/>
      <circle cx="104" cy="70" r="14" fill="#20BEFF"/><text x="104" y="75" fill="#0f0c29" font-size="14" font-weight="700">1</text>
      <text x="104" y="115" fill="#fff" font-size="15" font-weight="600">GitHub</text>
      <text x="104" y="134" fill="#fff" font-size="15" font-weight="600">Actions</text>
      <text x="104" y="154" fill="#9aa4c7" font-size="11">cron · 6:30 AM</text>
    </g>
    <g>
      <rect x="198" y="70" width="128" height="96" rx="14" fill="url(#node)" stroke="#20BEFF" stroke-opacity=".6"/>
      <circle cx="262" cy="70" r="14" fill="#20BEFF"/><text x="262" y="75" fill="#0f0c29" font-size="14" font-weight="700">2</text>
      <text x="262" y="115" fill="#fff" font-size="15" font-weight="600">Kaggle</text>
      <text x="262" y="134" fill="#fff" font-size="15" font-weight="600">Kernel</text>
      <text x="262" y="154" fill="#9aa4c7" font-size="11">Nvidia T4 GPU</text>
    </g>
    <g>
      <rect x="356" y="70" width="128" height="96" rx="14" fill="url(#node)" stroke="#20BEFF" stroke-opacity=".6"/>
      <circle cx="420" cy="70" r="14" fill="#20BEFF"/><text x="420" y="75" fill="#0f0c29" font-size="14" font-weight="700">3</text>
      <text x="420" y="115" fill="#fff" font-size="15" font-weight="600">Ollama</text>
      <text x="420" y="134" fill="#fff" font-size="15" font-weight="600">+ Qwen</text>
      <text x="420" y="154" fill="#9aa4c7" font-size="11">local inference</text>
    </g>
    <g>
      <rect x="514" y="70" width="128" height="96" rx="14" fill="url(#node)" stroke="#20BEFF" stroke-opacity=".6"/>
      <circle cx="578" cy="70" r="14" fill="#20BEFF"/><text x="578" y="75" fill="#0f0c29" font-size="14" font-weight="700">4</text>
      <text x="578" y="115" fill="#fff" font-size="15" font-weight="600">CrewAI</text>
      <text x="578" y="134" fill="#fff" font-size="15" font-weight="600">Agents</text>
      <text x="578" y="154" fill="#9aa4c7" font-size="11">research · edit</text>
    </g>
    <g>
      <rect x="672" y="70" width="128" height="96" rx="14" fill="url(#node)" stroke="#20BEFF" stroke-opacity=".6"/>
      <circle cx="736" cy="70" r="14" fill="#20BEFF"/><text x="736" y="75" fill="#0f0c29" font-size="14" font-weight="700">5</text>
      <text x="736" y="115" fill="#fff" font-size="15" font-weight="600">ReportLab</text>
      <text x="736" y="134" fill="#fff" font-size="15" font-weight="600">PDF</text>
      <text x="736" y="154" fill="#9aa4c7" font-size="11">formatted digest</text>
    </g>
    <g>
      <rect x="830" y="70" width="128" height="96" rx="14" fill="#20BEFF"/>
      <circle cx="894" cy="70" r="14" fill="#fff"/><text x="894" y="75" fill="#0f0c29" font-size="14" font-weight="700">6</text>
      <text x="894" y="115" fill="#0f0c29" font-size="15" font-weight="700">Subscriber</text>
      <text x="894" y="134" fill="#0f0c29" font-size="15" font-weight="700">Inbox</text>
      <text x="894" y="154" fill="#0f0c29" font-size="11">via SMTP</text>
    </g>
  </g>

  <!-- arrows -->
  <g stroke="#20BEFF" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="170" y1="118" x2="196" y2="118"/>
    <line x1="328" y1="118" x2="354" y2="118"/>
    <line x1="486" y1="118" x2="512" y2="118"/>
    <line x1="644" y1="118" x2="670" y2="118"/>
    <line x1="802" y1="118" x2="828" y2="118"/>
  </g>

  <!-- news source -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <rect x="518" y="208" width="120" height="38" rx="10" fill="none" stroke="#9aa4c7" stroke-dasharray="5 4"/>
    <text x="578" y="232" fill="#cfd6f5" font-size="13">NewsData API</text>
    <line x1="578" y1="206" x2="578" y2="170" stroke="#20BEFF" stroke-width="2" marker-end="url(#ah)"/>
  </g>
</svg>
