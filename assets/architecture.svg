<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="Sift AI architecture" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/><stop offset="1" stop-color="#1b1747"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#302b63"/><stop offset="1" stop-color="#1f1b4a"/>
    </linearGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#20BEFF"/>
    </marker>
  </defs>
  <rect width="1000" height="540" rx="20" fill="url(#bg)"/>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <!-- Trigger -->
    <rect x="300" y="30" width="300" height="72" rx="14" fill="url(#node)" stroke="#20BEFF" stroke-opacity=".7"/>
    <text x="450" y="62" fill="#fff" font-size="17" font-weight="700">GitHub Actions</text>
    <text x="450" y="84" fill="#9aa4c7" font-size="12">cron  ·  repository_dispatch</text>

    <!-- News API -->
    <rect x="720" y="30" width="230" height="72" rx="14" fill="none" stroke="#9aa4c7" stroke-dasharray="6 4"/>
    <text x="835" y="62" fill="#fff" font-size="17" font-weight="700">NewsData API</text>
    <text x="835" y="84" fill="#9aa4c7" font-size="12">global headlines</text>

    <!-- Compute container -->
    <rect x="50" y="160" width="900" height="250" rx="18" fill="#ffffff" fill-opacity=".03" stroke="#20BEFF" stroke-width="1.5" stroke-dasharray="8 5"/>
    <text x="74" y="190" text-anchor="start" fill="#20BEFF" font-size="12" font-weight="700" letter-spacing="2.5">KAGGLE CLOUD  ·  HEADLESS NVIDIA T4</text>

    <!-- Ollama -->
    <rect x="80" y="225" width="190" height="110" rx="14" fill="url(#node)" stroke="#20BEFF" stroke-opacity=".7"/>
    <text x="175" y="272" fill="#fff" font-size="17" font-weight="700">Ollama</text>
    <text x="175" y="294" fill="#9aa4c7" font-size="12">Qwen open-weight model</text>
    <text x="175" y="312" fill="#9aa4c7" font-size="12">local inference</text>

    <!-- Crew container -->
    <rect x="320" y="210" width="600" height="170" rx="16" fill="#20BEFF" fill-opacity=".06" stroke="#20BEFF" stroke-opacity=".5"/>
    <text x="344" y="237" text-anchor="start" fill="#cfd6f5" font-size="13" font-weight="700" letter-spacing="2">CREWAI CREW</text>

    <rect x="344" y="258" width="164" height="96" rx="12" fill="url(#node)" stroke="#20BEFF" stroke-opacity=".6"/>
    <text x="426" y="290" fill="#20BEFF" font-size="12" font-weight="700">01</text>
    <text x="426" y="314" fill="#fff" font-size="15" font-weight="600">Researcher</text>
    <text x="426" y="334" fill="#9aa4c7" font-size="11">extract facts</text>

    <rect x="568" y="258" width="164" height="96" rx="12" fill="url(#node)" stroke="#20BEFF" stroke-opacity=".6"/>
    <text x="650" y="290" fill="#20BEFF" font-size="12" font-weight="700">02</text>
    <text x="650" y="314" fill="#fff" font-size="15" font-weight="600">Synthesizer</text>
    <text x="650" y="334" fill="#9aa4c7" font-size="11">cross-verify</text>

    <rect x="792" y="258" width="104" height="96" rx="12" fill="url(#node)" stroke="#20BEFF" stroke-opacity=".6"/>
    <text x="844" y="290" fill="#20BEFF" font-size="12" font-weight="700">03</text>
    <text x="844" y="314" fill="#fff" font-size="15" font-weight="600">Editor</text>
    <text x="844" y="334" fill="#9aa4c7" font-size="11">polish</text>

    <!-- Output row -->
    <rect x="200" y="460" width="220" height="60" rx="14" fill="url(#node)" stroke="#20BEFF" stroke-opacity=".7"/>
    <text x="310" y="486" fill="#fff" font-size="16" font-weight="700">ReportLab</text>
    <text x="310" y="506" fill="#9aa4c7" font-size="12">PDF generation</text>

    <rect x="580" y="460" width="220" height="60" rx="14" fill="#20BEFF"/>
    <text x="690" y="486" fill="#0f0c29" font-size="16" font-weight="700">Subscriber Inbox</text>
    <text x="690" y="506" fill="#0f0c29" font-size="12">daily PDF briefing</text>

    <!-- arrow labels -->
    <text x="462" y="134" text-anchor="start" fill="#9aa4c7" font-size="11">Kaggle CLI push</text>
    <text x="848" y="134" text-anchor="start" fill="#9aa4c7" font-size="11">fetch</text>
    <text x="500" y="480" fill="#9aa4c7" font-size="11">SMTP</text>
  </g>

  <!-- arrows -->
  <g stroke="#20BEFF" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="450" y1="104" x2="450" y2="158"/>
    <line x1="835" y1="104" x2="835" y2="208"/>
    <line x1="272" y1="280" x2="318" y2="280"/>
    <line x1="510" y1="306" x2="566" y2="306"/>
    <line x1="734" y1="306" x2="790" y2="306"/>
    <line x1="310" y1="412" x2="310" y2="458"/>
    <line x1="422" y1="490" x2="578" y2="490"/>
  </g>
</svg>
