name: Scheduled Colab CrewAI Runner

on:
  schedule:
    - cron: '0 9 * * *'
  repository_dispatch:
    types: [trigger_colab_run]
  workflow_dispatch:

jobs:
  run-colab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Hydrate Session Credentials
        env:
          GOOGLE_AUTH_JSON: ${{ secrets.GOOGLE_AUTH_JSON }}
        run: |
          echo "$GOOGLE_AUTH_JSON" > google_auth.json

      - name: Execute Colab Runner
        env:
          COLAB_URL: ${{ secrets.COLAB_URL }}
        run: |
          python run_colab.py

      - name: Upload Screenshot Artifact on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshot
          path: failure.png